spring.application.name=algafood-api
# ==============================
#   CONFIG BANCO DE DADOS
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/pizza?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
#   JPA / HIBERNATE
# ==============================
# Cria/atualiza as tabelas conforme as entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dialeto do MySQL (opcional, o Spring geralmente descobre sozinho)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
