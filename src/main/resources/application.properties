spring.application.name=algafood-api
# ==============================
#   CONFIG BANCO DE DADOS
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/algafood?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
#   JPA / HIBERNATE
# ==============================
# Cria/atualiza as tabelas conforme as entidades
spring.jpa.hibernate.ddl-auto=create
spring.jpa.ddl-generate=true

